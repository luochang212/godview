# Bundle layer for dsh-godview.
# Installed by `dsh plugin --profile <profile> add dsh-godview`; the row
# references the package by name so Node resolution finds the installed code.
- insert:
    - id: dsh-godview
      name: dsh-godview
      config:
        heartbeatMs: 15000
        ttlMs: 60000
        autoClaimTtlMs: 600000
        releaseAutoOnIdle: true
